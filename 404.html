<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | 구미가톨릭</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <!-- 어느 깊이의 주소에서도 열리므로 경로는 모두 / 로 시작한다. 외부 글꼴 없이 시스템 글꼴만 쓴다. -->
  <style>
    :root{--ink:#3b2416;--ink-2:#5e4634;--muted:#8a7461;--line:#e3d3bd;--card:#fffaf3}
    *{box-sizing:border-box}
    body{margin:0;background:#f6efe4;color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
    main{max-width:720px;margin:0 auto;padding:56px 22px 72px}
    .home{color:#8a5f35;font-size:16px}
    h1{margin:22px 0 10px;font-family:'AppleMyungjo','Batang',serif;font-size:clamp(26px,6.4vw,34px);line-height:1.4}
    .lead{margin:0 0 32px;color:var(--ink-2)}
    ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
    li b{display:block;font-size:19px}
    li small{display:block;margin-top:2px;font-size:14.5px;color:var(--muted)}
    .go{flex-shrink:0;padding:10px 16px;border-radius:999px;background:#6c523e;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
    .tel{display:block;margin-top:8px;color:var(--ink-2);font-size:15px;text-decoration:none}
    .tel b{display:inline;font-size:15px}
    .note{margin-top:28px;font-size:15px;color:var(--muted)}
    .note a{color:#8a5f35}
    a:focus-visible{outline:2px solid #6c523e;outline-offset:3px}
  </style>
</head>
<body>
<main>
  <a class="home" href="/">구미가톨릭 대문으로</a>
  <h1>찾으시는 페이지가 없습니다.</h1>
  <p class="lead">주소가 바뀌었거나 잘못 입력되었을 수 있습니다. 아래에서 기관을 골라 주세요.</p>
  <ul>
    <li><div><b>구미가톨릭요양병원</b><small>입원 치료와 투석</small><a class="tel" href="tel:0544558883">전화 <b>054-455-8883</b></a></div><a class="go" href="/hospital/">바로가기</a></li>
    <li><div><b>구미가톨릭요양원</b><small>함께 생활하는 돌봄</small><a class="tel" href="tel:0544430303">전화 <b>054-443-0303</b></a></div><a class="go" href="/nursing-home/">바로가기</a></li>
    <li><div><b>구미가톨릭재가노인복지센터</b><small>집으로 찾아가는 돌봄</small><a class="tel" href="tel:0544430303">전화 <b>054-443-0303</b></a></div><a class="go" href="/home-care/">바로가기</a></li>
  </ul>
  <p class="note">경상북도 구미시 야은로 483 · <a href="/privacy/">개인정보 처리방침</a></p>
</main>
</body>
</html>
